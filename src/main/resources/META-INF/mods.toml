side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory=true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "geckolib"
mandatory=true
versionRange = "${geckolib_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "twilightforest"
mandatory=true
versionRange = "${twilightforest_version_range}"
ordering = "NONE"
side = "BOTH"
