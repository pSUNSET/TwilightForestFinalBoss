modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Twilight Forest Final Boss (remake)"
authors = "D_Angry_Modder, LShiftLess"
description = '''An additional mod to add the final boss to Twilight Forest.'''
logoFile = "icon.png"

[[mixins]]
config = "twilightforestfinalboss.mixins.json"

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory=true
versionRange = "${forge_version_range}"
